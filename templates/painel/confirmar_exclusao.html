{% extends "painel/base.html" %}

{% block content %}
<div style="max-width:480px;margin:0 auto;padding-top:2rem;">
  <div class="panel-card" style="padding:2.5rem;text-align:center;">
    <div style="font-size:3.5rem;margin-bottom:1rem;">🗑️</div>
    <h2 style="font-size:1.25rem;font-weight:800;color:#F0F0F0;margin-bottom:0.5rem;">
      Excluir {{ tipo }}?
    </h2>
    <p style="color:#9CA3AF;font-size:0.9rem;margin-bottom:0.5rem;">
      Você está prestes a excluir:
    </p>
    <p style="color:#F87171;font-weight:700;font-size:1rem;margin-bottom:1.5rem;">
      "{{ objeto }}"
    </p>
    <p style="color:#6B7280;font-size:0.8rem;margin-bottom:2rem;">
      Esta ação não pode ser desfeita.
    </p>
    <form method="post" style="display:inline;">
      {% csrf_token %}
      <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
        <a href="{% url voltar_url %}" class="btn-outline" style="padding:0.65rem 1.5rem;">
          ← Cancelar
        </a>
        <button type="submit" class="btn-danger" style="padding:0.65rem 1.5rem;font-size:0.875rem;">
          🗑️ Sim, excluir
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
